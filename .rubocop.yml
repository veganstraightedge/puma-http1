AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

# The parser is a state machine that follows Puma's Ragel grammar, one state
# per grammar element, so it's long and branchy on purpose.
Metrics/AbcSize:
  Exclude:
    - lib/puma/http1/parser.rb
    - test/**/*

Metrics/BlockLength:
  Exclude:
    - "*.gemspec"

# Tests follow Puma's style: one class per file, with a test method per case.
Metrics/ClassLength:
  Exclude:
    - lib/puma/http1/parser.rb
    - test/**/*

Metrics/BlockNesting:
  Exclude:
    - lib/puma/http1/parser.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - lib/puma/http1/parser.rb

Metrics/MethodLength:
  Max: 20
  Exclude:
    - lib/puma/http1/parser.rb

Metrics/PerceivedComplexity:
  Exclude:
    - lib/puma/http1/parser.rb

# `it` is used for single-parameter blocks, but not in nested blocks, where it
# would shadow the outer `it`. The cop's autocorrect can't tell them apart.
Style/ItBlockParameter:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
